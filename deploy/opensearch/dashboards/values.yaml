# Helm values for opensearch/opensearch-dashboards.
# opensearchHosts and opensearchAccount.secret are set by deploy.sh / deploy.ps1.

replicaCount: 1

image:
  repository: opensearchproject/opensearch-dashboards
  tag: "3"
  pullPolicy: IfNotPresent

opensearchHosts: "https://10.1.139.63:9200"

opensearchAccount:
  secret: opensearch-dashboards-credentials
  keyPassphrase:
    enabled: false

serverHost: "0.0.0.0"

service:
  type: NodePort
  port: 5601

config:
  opensearch_dashboards.yml: |
    opensearch.ssl.verificationMode: none
    opensearch.requestHeadersWhitelist: ["securitytenant", "Authorization"]
    opensearch_security.multitenancy.enabled: true
    opensearch_security.multitenancy.tenants.preferred: ["Private", "Global"]
    opensearch_security.readonly_mode.roles: ["kibana_read_only"]

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
