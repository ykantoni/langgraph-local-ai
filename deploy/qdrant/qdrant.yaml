# Qdrant for benchmark.py (100k-vector workload).
#
# Deploy:
#   kubectl apply -f deploy/qdrant/qdrant.yaml
#   kubectl wait --for=condition=available deployment/qdrant-bench -n qdrant-bench --timeout=300s
#   kubectl get nodes -o wide
#   kubectl get svc qdrant-bench -n qdrant-bench
#
# From host (NodePort): NODE_IP + port from 6333:<nodePort>/TCP
#   set QDRANT_URL=http://172.19.73.182:31234
#   python benchmark.py
#
# In-cluster:
#   curl http://qdrant-bench.qdrant-bench.svc:6333/readyz
#
# port-forward:
#   kubectl port-forward -n qdrant-bench svc/qdrant-bench 6333:6333
#   set QDRANT_URL=http://127.0.0.1:6333
---
apiVersion: v1
kind: Namespace
metadata:
  name: qdrant-bench
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qdrant-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /mnt/kubehome/qdrant
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - titan  
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-bench-data
  namespace: qdrant-bench
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: qdrant-pv  
  resources:
    requests:
      storage: 10Gi
  # Omit storageClassName to use the cluster default StorageClass.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-bench
  namespace: qdrant-bench
  labels:
    app: qdrant-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant-bench
  template:
    metadata:
      labels:
        app: qdrant-bench
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.17.0
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          env:
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            - name: QDRANT__STORAGE__STORAGE_PATH
              value: /qdrant/storage
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: qdrant-bench-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-bench
  namespace: qdrant-bench
  labels:
    app: qdrant-bench
spec:
  type: NodePort
  selector:
    app: qdrant-bench
  ports:
    - name: http
      port: 6333
      targetPort: http
      # nodePort omitted — Kubernetes assigns 30000–32767; read with kubectl get svc
    - name: grpc
      port: 6334
      targetPort: grpc
